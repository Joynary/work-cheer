name: Package Work Cheer

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create installable web package
        run: cd work-cheer && zip -r ../work-cheer.zip .
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: work-cheer.zip
